<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF4D00" />
  <title>Click Control — Gestão Colaborativa de Wi-Fi</title>

  <!-- Leaflet (Mapa Interativo) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #FF4D00;
      --primary-hover: #E04300;
      --bg-dark: #0F1115;
      --bg-card: #181B22;
      --bg-input: #222630;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --border: #2D323E;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ================= TELA DE LOGIN / CADASTRO ================= */
    #auth-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, #1f1612 0%, var(--bg-dark) 65%);
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(255, 77, 0, 0.15);
      color: var(--primary);
      margin-bottom: 12px;
    }

    .brand-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-header h1 span {
      color: var(--primary);
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 4px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-input);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .auth-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .auth-tab.active {
      background: var(--primary);
      color: #fff;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .auth-feedback {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      line-height: 1.4;
    }

    .auth-feedback.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #FCA5A5;
    }

    .auth-feedback.info {
      display: block;
      background: rgba(255, 77, 0, 0.15);
      border: 1px solid rgba(255, 77, 0, 0.4);
      color: #FDBA74;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ================= APP PRINCIPAL ================= */
    #app-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-title {
      font-weight: 800;
      font-size: 1.1rem;
    }

    .topbar-title span {
      color: var(--primary);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .credit-pill {
      background: rgba(255, 77, 0, 0.15);
      border: 1px solid rgba(255, 77, 0, 0.35);
      color: #FF7A3D;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .btn-icon {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      position: relative;
      padding-bottom: 72px;
    }

    .tab-pane {
      display: none;
      height: 100%;
    }

    .tab-pane.active {
      display: block;
    }

    #map {
      width: 100%;
      height: calc(100vh - 126px);
      z-index: 1;
    }

    .section-container {
      padding: 16px;
      max-width: 720px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .speed-badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .speed-fast { background: rgba(16, 185, 129, 0.15); color: #34D399; }
    .speed-med  { background: rgba(245, 158, 11, 0.15); color: #FBBF24; }
    .speed-slow { background: rgba(239, 68, 68, 0.15); color: #F87171; }

    .wifi-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Barra de Navegação Inferior */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 66px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 1000;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--primary);
    }

    /* Modal QR Code */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    #qrcode-container {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <!-- ================= TELA DE AUTENTICAÇÃO ================= -->
  <section id="auth-screen">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-badge">
          <i data-lucide="wifi" style="width:28px;height:28px;"></i>
        </div>
        <h1>Click <span>Control</span></h1>
        <p>Rede colaborativa de pontos Wi-Fi &amp; velocidade</p>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-btn-login" onclick="switchAuthMode('login')">Entrar</button>
        <button type="button" class="auth-tab" id="tab-btn-register" onclick="switchAuthMode('register')">Criar Conta</button>
      </div>

      <!-- Formulário de Login -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" class="form-control" placeholder="seu@email.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" id="btn-submit-login" class="btn-primary">
          <span>Entrar no Sistema</span>
        </button>
      </form>

      <!-- Formulário de Cadastro -->
      <form id="register-form" style="display:none;" novalidate>
        <div class="form-group">
          <label for="reg-name">Nome completo</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Seu

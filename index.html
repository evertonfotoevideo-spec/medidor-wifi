<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Click Control v54 - Gestão & Rede Colaborativa de Wi-Fi</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        :root {
            --bg-color: #facc15;
            --card-bg: #fef08a;
            --primary: #111111;
            --primary-hover: #27272a;
            --primary-text: #facc15;
            --secondary: #18181b;
            --secondary-hover: #000000;
            --text-main: #111111;
            --text-muted: #3f3f46;
            --border: #111111;
            --input-bg: #ffffff;
            --accent-glow: rgba(17, 17, 17, 0.10);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            touch-action: manipulation;
        }
        button, a, .tab-btn, .filter-pill, .speed-pill, .user-menu-item, span[onclick], .prio-btn, .auth-link, .btn, .btn-mini, .btn-gps, .btn-quick {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100dvh;
            padding: 6px;
        }
        body.mapa-fit-screen {
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden;
        }
        body.mapa-fit-screen .container {
            height: calc(100dvh - 12px);
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow: hidden;
        }
        body.mapa-fit-screen #appScreen {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        body.mapa-fit-screen .top-navbar {

            flex-shrink: 0;
        }
        body.mapa-fit-screen .tabs {
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        body.mapa-fit-screen #abaMapa {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        body.mapa-fit-screen #abaMapa .filter-toolbar {
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        body.mapa-fit-screen #abaMapa #miniMap {
            flex: 1;
            height: auto;
            min-height: 140px;
            margin-bottom: 4px;
        }
        body.mapa-fit-screen #abaMapa #zoomFilterNotice {
            margin-bottom: 4px;
            font-size: 0.68rem;
            flex-shrink: 0;
        }
        body.mapa-fit-screen #abaMapa .map-bottom-controls {
            flex-shrink: 0;
            margin-top: 0;
            margin-bottom: 4px;
        }
        body.mapa-fit-screen #abaMapa .map-bottom-controls label {
            display: none;
        }
        body.mapa-fit-screen #abaMapa .map-bottom-controls .helper-text {
            margin-top: 2px;
            font-size: 0.68rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        body.mapa-fit-screen #abaMapa .btn-map-dados {
            margin-top: 2px !important;
            padding: 9px 12px;
            font-size: 0.84rem;
            flex-shrink: 0;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 10px 28px rgba(17, 17, 17, 0.25);
        }
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .brand-block h1 {
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            line-height: 1.1;
        }
        .brand-block p {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-top: 2px;
        }
        .user-dropdown-wrap {
            position: relative;
            display: inline-block;
        }
        .user-trigger-btn {
            background-color: var(--input-bg);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 7px 12px;
            border-radius: 999px;

            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 185px;
            transition: all 0.15s;
        }
        .user-trigger-btn:hover {
            background-color: var(--accent-glow);
        }
        .user-trigger-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-dropdown-menu {
            position: absolute;

            top: calc(100% + 6px);

            border: 1px solid var(--primary);
            border-radius: 12px;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.85);
            z-index: 2500;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .user-menu-header {
            padding: 10px 12px;
            background-color: #111111;
            border-bottom: 1px solid var(--border);
            font-size: 0.72rem;
            color: #facc15;
        }
        .user-menu-header strong {
            display: block;
            color: #ffffff;
            font-size: 0.82rem;
            margin-top: 2px;
        }
        .user-menu-item {
            background: none;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        .user-menu-item:last-child {
            border-bottom: none;
        }
        .user-menu-item:hover {
            background-color: rgba(250, 204, 21, 0.25);
            color: var(--primary);
        }
        .user-menu-item.danger {
            color: #dc2626;
        }
        .user-menu-item.danger:hover {
            background-color: rgba(239, 68, 68, 0.14);
        }
        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-bottom: 12px;
            background-color: var(--input-bg);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 6px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            line-height: 1.2;
        }
        .tab-btn.active {
            background-color: var(--primary);
            color: var(--primary-text);
        }
        .filter-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .btn-filter-toggle {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.15s;
        }
        .btn-filter-toggle:hover {
            background-color: var(--accent-glow);
        }
        .filter-badge-count {
            background-color: var(--primary);
            color: var(--primary-text);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 800;
        }
        .filter-drawer {
            background-color: #fef9c3;
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }
        .filter-section-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .prio-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background-color: var(--input-bg);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .prio-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 7px 6px;
            border-radius: 7px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .prio-btn.active {
            background-color: var(--primary);
            color: var(--primary-text);
        }
        .filter-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .filter-pill {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 0.74rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .filter-pill.active {
            background-color: var(--primary);
            border-color: var(--primary);
            color: var(--primary-text);
        }
        .speed-filter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .speed-pill {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }
        .speed-pill.active {
            border-color: var(--primary);
            background-color: var(--primary);
            color: var(--primary-text);
            font-weight: 800;
        }
        .dot-c {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid #fff;
            flex-shrink: 0;
        }
        .leaflet-container {
            background: #e5e7eb !important;
        }
        .leaflet-tile-pane {
            filter: brightness(1.06) contrast(1.05);
        }
        #miniMap {
            width: 100%;
            height: 440px;
            min-height: 54vh;
            border-radius: 12px;
            border: 1px solid var(--primary);
            margin-bottom: 8px;
            z-index: 1;
        }
        .auth-toggle {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .auth-link {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding-bottom: 4px;
        }
        .auth-link.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.86rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
        }
        .gps-row {
            display: flex;
            gap: 8px;
        }
        .gps-row input, .gps-row select {
            flex: 1;
        }
        .btn-gps {
            background-color: var(--secondary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-gps:hover:not(:disabled) {
            background-color: var(--secondary-hover);
        }
        .btn-gps:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .info-badge {
            background-color: var(--accent-glow);
            border: 1px solid rgba(17, 17, 17, 0.35);
            color: var(--primary);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            margin-bottom: 14px;
            text-align: center;
            line-height: 1.4;
        }
        .current-wifi-banner {
            background-color: var(--input-bg);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: left;
        }
        .current-wifi-banner .tag-live {
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--primary);
            letter-spacing: 0.5px;
